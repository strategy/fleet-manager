<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FleetManager · Hartă</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; color: #18212b; }
    #map { position: absolute; inset: 0; }
    .panel { position: absolute; top: 12px; right: 12px; z-index: 1000; background: #fff; border-radius: 10px; padding: 12px 16px; box-shadow: 0 2px 10px rgba(0, 0, 0, .2); font-size: 14px; }
    .panel h1 { font-size: 16px; margin: 0 0 8px; }
    .legend { display: flex; flex-direction: column; gap: 6px; }
    .legend span { display: inline-flex; align-items: center; gap: 8px; }
    .badge { display: inline-flex; width: 22px; height: 22px; border-radius: 4px; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .4); box-sizing: border-box; }
    .badge.parked { background: #2563eb; }
    .badge.en_route { background: #f08a24; }
    .badge.arrived { background: #16a34a; }
    .vehicle-marker { background: none; border: none; }
    .vehicle-marker .plate { position: absolute; left: 26px; top: 2px; white-space: nowrap; background: rgba(255, 255, 255, .9); padding: 0 4px; border-radius: 3px; font-size: 12px; font-weight: 600; }
    #updated { color: #4a5562; margin-top: 8px; }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>Flota în timp real</h1>
    <div class="legend">
      <span><span class="badge parked">P</span> în parcare (Oradea)</span>
      <span><span class="badge en_route">➜</span> în cursă</span>
      <span><span class="badge arrived">✓</span> a ajuns</span>
    </div>
    <div id="updated">Se încarcă…</div>
  </div>

  <script>
    const ICONS = { parked: "P", en_route: "➜", arrived: "✓" };
    const LABELS = { parked: "În parcare", en_route: "În cursă", arrived: "A ajuns" };

    const map = L.map("map").setView([45.9, 24.9], 7); // România
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    const markers = new Map(); // plate → marker

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function icon(v) {
      return L.divIcon({
        className: "vehicle-marker",
        iconSize: [22, 22],
        iconAnchor: [11, 11],
        html: '<span class="badge ' + v.status + '">' + ICONS[v.status] + '</span>' +
              '<span class="plate">' + escapeHtml(v.plate) + "</span>",
      });
    }

    function popup(v) {
      const where = v.status === "parked" ? "Parcare Oradea" : v.destination;
      return "<b>" + escapeHtml(v.plate) + "</b> · " + escapeHtml(v.model) + "<br>" +
             LABELS[v.status] + ": " + escapeHtml(where) + "<br>" +
             v.lat.toFixed(5) + ", " + v.lng.toFixed(5);
    }

    // Toate mașinile din parcare stau pe același punct: le arătăm ca un singur marcaj.
    const PARKING = [47.0465, 21.9189];
    const parkingMarker = L.marker(PARKING);

    function updateParking(parked) {
      if (parked.length === 0) {
        parkingMarker.remove();
        return;
      }
      parkingMarker.setIcon(icon({ status: "parked", plate: "Parcare Oradea (" + parked.length + ")" }));
      parkingMarker.bindPopup("<b>Parcare Oradea</b><br>" +
        parked.map((v) => escapeHtml(v.plate) + " · " + escapeHtml(v.model)).join("<br>"));
      parkingMarker.addTo(map);
    }

    // Pozițiile vin din DynamoDB prin /api/vehicles, actualizate de worker.
    async function refresh() {
      try {
        const vehicles = await (await fetch(window.API_URL + "/api/vehicles")).json();
        updateParking(vehicles.filter((v) => v.status === "parked"));
        const seen = new Set();
        for (const v of vehicles.filter((v) => v.status !== "parked")) {
          seen.add(v.plate);
          let marker = markers.get(v.plate);
          if (!marker) {
            marker = L.marker([v.lat, v.lng]).addTo(map);
            markers.set(v.plate, marker);
          }
          marker.setLatLng([v.lat, v.lng]).setIcon(icon(v));
          marker.bindPopup(popup(v));
        }
        for (const [plate, marker] of markers) {
          if (!seen.has(plate)) {
            marker.remove();
            markers.delete(plate);
          }
        }
        document.getElementById("updated").textContent =
          vehicles.length + " mașini · actualizat la " + new Date().toLocaleTimeString("ro-RO");
      } catch (e) {
        document.getElementById("updated").textContent = "API indisponibil";
      }
    }

    refresh();
    setInterval(refresh, window.REFRESH_MS || 3000);
  </script>
</body>
</html>
