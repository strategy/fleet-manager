# LocalStack pornit cu Docker Compose, alternativa la `lstk` (metoda B din README).
# Pornește doar emulatorul AWS; aplicația rulează în el, ca funcții Lambda (npm run deploy:localstack:docker).
#   docker compose up -d       pornește LocalStack
#   docker compose stop        îl oprește
# Folosiți ori lstk, ori acest fișier, niciodată pe amândouă deodată: ambele vor portul 4566.
services:
  localstack:
    image: localstack/localstack:2026.10.1
    ports:
      - "127.0.0.1:4566:4566"            # toate serviciile AWS emulate
      - "127.0.0.1:4510-4559:4510-4559"  # porturi folosite de unele servicii
    # token-ul stă în .env.localstack, care nu se comite
    env_file:
      - path: .env.localstack
        required: false
    volumes:
      # LocalStack rulează fiecare funcție Lambda într-un container separat
      - /var/run/docker.sock:/var/run/docker.sock
